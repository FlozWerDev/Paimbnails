name: Build Geode Mod

on:
  workflow_dispatch:
  push:
    branches:
      - "**"
    tags:
      - "v*"
      - "beta-v*"

jobs:
  build:
    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Windows
            os: windows-latest
            target: Win64
          - name: Android32
            os: ubuntu-latest
            target: Android32
          - name: Android64
            os: ubuntu-latest
            target: Android64

    steps:
      - uses: actions/checkout@v4

      - name: Set up MSVC environment
        if: matrix.config.target == 'Win64'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build the mod
        id: geode-build
        continue-on-error: true
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: given
          target: ${{ matrix.config.target }}
          combine: true
          # warm caches across runs: sccache recompiles only changed tus,
          # cpm skips re-downloading third-party sources.
          ccache-variant: sccache
          use-cpm-cache: true

      - name: Show sccache stats
        if: always()
        shell: bash
        run: sccache --show-stats || true

      - name: Report compiler diagnostics
        if: steps.geode-build.outcome == 'failure'
        shell: bash
        run: |
          cmake --build build --config Release --parallel 1 > build-diagnostics.log 2>&1 || true
          {
            echo "### Compiler diagnostics (${{ matrix.config.name }})"
            echo '```text'
            tail -n 250 build-diagnostics.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          awk '/error:/ { print "::error::" $0; if (++count == 20) exit }' build-diagnostics.log
          cat build-diagnostics.log
          exit 1

  package:
    name: Package Windows and Android
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Combine platform builds
        id: build
        uses: geode-sdk/build-geode-mod/combine@main

      - name: Upload combined mod
        uses: actions/upload-artifact@v4
        with:
          name: Build Output
          path: ${{ steps.build.outputs.build-output }}
          if-no-files-found: error

  build-installer:
    name: Build Windows Installer
    runs-on: windows-latest
    needs: package

    steps:
      - uses: actions/checkout@v4

      - name: Download the combined mod
        uses: actions/download-artifact@v4
        with:
          name: Build Output
          path: build

      - name: Prepare .geode for installer
        shell: pwsh
        run: |
          $file = Get-ChildItem -Path build -Filter "*.geode" -File | Select-Object -First 1
          if (-not $file) {
            throw "No .geode file was produced by the package job."
          }
          if ($file.Name -ne "flozwer.paimbnails2.geode") {
            Copy-Item $file.FullName -Destination "build\flozwer.paimbnails2.geode" -Force
          }

      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis -y
          "C:\Program Files (x86)\NSIS" >> $env:GITHUB_PATH

      - name: Build NSIS installer
        shell: pwsh
        run: |
          Set-Location installer
          $releaseTag = "${{ github.ref_name }}"
          $buildNumber = [regex]::Match($releaseTag, '-(\d+)$').Groups[1].Value
          if (-not $buildNumber) { $buildNumber = "0" }
          & "C:\Program Files (x86)\NSIS\makensis.exe" "/DPAIMBNAILS_BUILD_NUMBER=$buildNumber" /V4 installer.nsi

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Paimbnails-Windows-Installer
          path: installer\Paimbnails-Installer.exe
          if-no-files-found: error

  release:
    name: Create official release
    runs-on: ubuntu-latest
    needs: [package, build-installer]
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/beta-v')
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download the combined mod
        uses: actions/download-artifact@v4
        with:
          name: Build Output
          path: release

      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: Paimbnails-Windows-Installer
          path: release

      - name: Build release notes
        shell: bash
        run: |
          {
            echo "## Descargas"
            echo ""
            echo "- \`flozwer.paimbnails2.geode\` — instalalo desde Geode, o copialo a la carpeta \`geode/mods\`."
            echo "- \`Paimbnails-Installer.exe\` — instalador para Windows."
            echo "- El archivo \`.geode\` incluye Windows, Android32 y Android64."
            echo ""
          } > notes.md
          # Keep the first changelog section as the official release notes.
          awk 'NR == 1 {next} /^# /{exit} {print}' changelog.md \
            | sed -E 's/<c[a-z]>//g; s|</c>||g; s/!\[\]\([^)]*\)//g' >> notes.md

      - name: List release files
        run: ls -lh release

      - name: Create official GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Paimbnails ${{ github.ref_name }}
          body_path: notes.md
          draft: false
          prerelease: ${{ startsWith(github.ref_name, 'beta-v') }}
          make_latest: ${{ !startsWith(github.ref_name, 'beta-v') }}
          fail_on_unmatched_files: true
          files: release/*
