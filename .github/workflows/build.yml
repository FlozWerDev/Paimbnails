name: Build Geode Mod

on:
  workflow_dispatch:
  push:
    branches:
      - "**"
    tags:
      - "v*"

jobs:
  build:
    name: Windows
    runs-on: depot-windows-2022

    steps:
      - uses: actions/checkout@v4

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Test editor physics solver
        shell: pwsh
        run: ./tests/run_editor_physics_regression.ps1

      - name: Test native physics trigger graph
        shell: pwsh
        run: ./tests/run_editor_physics_native_regression.ps1

      - name: Test physics preview backends
        shell: pwsh
        run: ./tests/run_editor_physics_preview_regression.ps1

      # Windows is the only target, so there is nothing for the combine action
      # to merge: it would pull the artifact back onto a second runner just to
      # copy the single .geode through. The build already leaves a finished one
      # in build-output, so it goes straight to the artifact the installer and
      # release jobs read.
      - name: Build the mod
        id: build
        uses: geode-sdk/build-geode-mod@main

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: Build Output
          path: ${{ steps.build.outputs.build-output }}
          if-no-files-found: error

  build-installer:
    name: Build Windows Installer
    runs-on: depot-windows-2022
    needs: build

    steps:
      - uses: actions/checkout@v4

      - name: Download the build output
        uses: actions/download-artifact@v4
        with:
          name: Build Output
          path: build

      - name: Prepare .geode for installer
        run: |
          $file = Get-ChildItem -Path build -Filter "*.geode" | Select-Object -First 1
          if ($file.Name -ne "flozwer.paimbnails2.geode") {
            Copy-Item $file.FullName -Destination "build\flozwer.paimbnails2.geode" -Force
          }

      - name: Install NSIS
        run: |
          choco install nsis -y
          echo "C:\Program Files (x86)\NSIS" >> $env:GITHUB_PATH

      - name: Build NSIS installer
        run: |
          cd installer
          & "C:\Program Files (x86)\NSIS\makensis.exe" /V4 installer.nsi

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Paimbnails-Windows-Installer
          path: installer\Paimbnails-Installer.exe

  beta:
    name: Publish beta release
    runs-on: depot-ubuntu-24.04
    needs: ['build', 'build-installer']
    # Tag pushes go to the real release job below; everything else that builds
    # gets a numbered beta so there is a record of every compilation.
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}

    permissions:
      contents: write

    # One at a time, otherwise two runs finishing together would both claim the
    # same beta number.
    concurrency:
      group: beta-release
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - name: Download the .geode
        uses: actions/download-artifact@v4
        with:
          name: Build Output
          path: release

      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: Paimbnails-Windows-Installer
          path: release

      # The counter restarts on every mod.json version bump, so betas read as
      # "1.1.2 #1, #2, #3..." instead of following the global run number.
      - name: Work out the beta number
        id: beta
        run: |
          version=$(jq -r .version mod.json)
          version=${version#v}
          prefix="beta-v${version}-"
          escaped=${prefix//./\\.}
          last=$(git ls-remote --tags origin \
            | sed -E 's#.*refs/tags/##; s/\^\{\}$//' \
            | grep -E "^${escaped}[0-9]+$" \
            | sed -E "s/^${escaped}//" \
            | sort -n | tail -n1 || true)
          number=$(( ${last:-0} + 1 ))
          {
            echo "version=${version}"
            echo "number=${number}"
            echo "tag=${prefix}${number}"
            echo "title=Paimbnails Beta ${version} #${number}"
          } >> "$GITHUB_OUTPUT"

      - name: Build release notes
        run: |
          # head_commit is missing on workflow_dispatch, so read the subject
          # from the checkout instead.
          title=$(git log -1 --pretty=%s)
          {
            echo "> Beta automatica de \`${{ github.ref_name }}\`. Sin probar, puede romper cosas."
            echo ""
            echo "## Descargas"
            echo ""
            echo "- \`flozwer.paimbnails2.geode\` — instalalo desde Geode, o copialo a la carpeta \`geode/mods\`."
            echo "- \`Paimbnails-Installer.exe\` — instalador para Windows."
            echo ""
            echo "## Esta build"
            echo ""
            echo "- Commit: [\`${GITHUB_SHA:0:7}\`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}) — ${title}"
            echo "- Rama: \`${{ github.ref_name }}\`"
            echo "- Run: [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
            echo ""
            echo "## Cambios de v${{ steps.beta.outputs.version }} hasta ahora"
            echo ""
          } > notes.md
          # Top changelog section, with the Geode colour and image markup
          # stripped. Its heading is dropped since the release title repeats it.
          awk 'NR == 1 {next} /^# /{exit} {print}' changelog.md \
            | sed -E 's/<c[a-z]>//g; s|</c>||g; s/!\[\]\([^)]*\)//g' >> notes.md

      - name: List release files
        run: ls -lh release

      - name: Create GitHub prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.beta.outputs.tag }}
          name: ${{ steps.beta.outputs.title }}
          body_path: notes.md
          draft: false
          prerelease: true
          make_latest: false
          fail_on_unmatched_files: true
          files: release/*

  release:
    name: Create Release
    runs-on: depot-ubuntu-24.04
    needs: ['build', 'build-installer']
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download the .geode
        uses: actions/download-artifact@v4
        with:
          name: Build Output
          path: release

      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: Paimbnails-Windows-Installer
          path: release

      - name: Build release notes
        run: |
          {
            echo "## Descargas"
            echo ""
            echo "- \`flozwer.paimbnails2.geode\` — instalalo desde Geode, o copialo a la carpeta \`geode/mods\`."
            echo "- \`Paimbnails-Installer.exe\` — instalador para Windows."
            echo ""
          } > notes.md
          # Top changelog section, with the Geode colour and image markup
          # stripped. Its heading is dropped since the release title repeats it.
          awk 'NR == 1 {next} /^# /{exit} {print}' changelog.md \
            | sed -E 's/<c[a-z]>//g; s|</c>||g; s/!\[\]\([^)]*\)//g' >> notes.md

      - name: List release files
        run: ls -lh release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Paimbnails ${{ github.ref_name }}
          body_path: notes.md
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: release/*
