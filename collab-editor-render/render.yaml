# Render blueprint for the Paimon Collab editor server.
# Deploy: push this folder to a repo and "New > Blueprint" on Render,
# or create a Web Service pointing at this directory.
services:
  - type: web
    name: paimon-collab
    runtime: node
    plan: free # free tier sleeps after ~15 min idle (cold start ~50s)
    rootDir: collab-editor-render
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: COLLAB_MAX_PEERS
        value: "10"
      - key: COLLAB_MAX_ROOMS
        value: "100"
      - key: COLLAB_MAX_OBJECTS
        value: "50000"
      - key: COLLAB_MAX_ROOM_BYTES
        value: "33554432"
      - key: COLLAB_MAX_SAVE_BYTES
        value: "65536"
      - key: COLLAB_MAX_QUEUE_BYTES
        value: "8388608"
